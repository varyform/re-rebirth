# The static site: a Vite build in an nginx image (Dockerfile) that kamal-proxy
# serves with Let's Encrypt. Server and hostname come from .env.deploy (copy
# .env.deploy.example); variables already set in the shell win.
# Kamal doesn't read .env files itself, hence the explicit load; dotenv comes
# with Kamal.
<% require "dotenv"; Dotenv.load(".env.deploy") %>

service: re-rebirth
image: re-rebirth

servers:
  web:
    - <%= ENV.fetch("SITE_SERVER") %>

# Kamal runs a registry on this machine and pushes to the server through the
# SSH tunnel, so no external registry or credentials are needed.
registry:
  server: localhost:5555

builder:
  arch: amd64

# kamal-proxy fetches the certificate: ports 80 and 443 on the server have to
# be reachable from the internet, and SITE_HOST's A record point at it.
proxy:
  ssl: true
  host: <%= ENV.fetch("SITE_HOST") %>
  app_port: 80
  healthcheck:
    path: /up

ssh:
  user: root
